name: Repair ZagKit v2 strict ownership fixtures

on:
  push:
    branches: [agent/v2-analytic-shadow-safe]
    paths:
      - .github/run-v2-semantics-repair

permissions:
  contents: write

concurrency:
  group: zagkit-v2-semantics-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ZNC: ${{ github.workspace }}/.toolchain/zag/zag-poc/znc

    steps:
      - name: Check out exact ZagKit integration branch
        uses: actions/checkout@v6
        with:
          ref: agent/v2-analytic-shadow-safe
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve pinned Zag revision
        id: toolchain
        shell: bash
        run: echo "zag_sha=$(jq -r '.zag.commit' contracts/toolchain.json)" >> "$GITHUB_OUTPUT"

      - name: Check out exact Zag compiler
        uses: actions/checkout@v6
        with:
          repository: Sylorlabs/zag
          ref: ${{ steps.toolchain.outputs.zag_sha }}
          path: .toolchain/zag

      - name: Repair strict-v2 semantics and sealed-destination fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          semantics = Path('src/semantics/semantics.zag')
          text = semantics.read_text()
          replacements = {
              'fn semantics_fail(tree: @borrows_mut *SemanticsTree,':
                  'fn semantics_fail(tree: *SemanticsTree,',
              'fn semantics_add(tree: @borrows_mut *SemanticsTree,':
                  'fn semantics_add(tree: *SemanticsTree,',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{semantics}: expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)
          semantics.write_text(text)

          contract = Path('tests/surface_contract.zag')
          text = contract.read_text()
          start_marker = '    let sealed_display: DisplayList = display_list_make();\n'
          end_marker = '    display_list_free(&sealed_display);\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit(f'{contract}: sealed destination start marker missing')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit(f'{contract}: sealed destination end marker missing')
          end = end + len(end_marker)
          replacement = (
              '    // Strict v2 forbids local aggregate addresses from escaping through\\n'
              '    // call graphs that may retain them. This negative destination fixture\\n'
              '    // therefore owns its builders explicitly and releases them after use.\\n'
              '    let sealed_display: *DisplayList = new(display_list_make());\\n'
              '    let sealed_hits: *HitTree = new(hit_tree_make());\\n'
              '    let sealed_semantics: *SemanticsTree = new(semantics_tree_make());\\n'
              '    _ = display_list_seal(sealed_display);\\n'
              '    let sealed: SurfaceBuildResult = surface_emit(action_fixture(730,\\n'
              '        SurfaceCanonicalState.rest), sealed_display, sealed_hits,\\n'
              '        sealed_semantics);\\n'
              '    expect(state, sealed.error == SurfaceBuildError.display_error &&\\n'
              '        sealed.display_error == DisplayError.sealed &&\\n'
              '        sealed_display.*.ops.len == 0 && sealed_hits.*.nodes.len == 0 &&\\n'
              '        sealed_semantics.*.nodes.len == 0,\\n'
              '        "sealed display destinations fail without partial hit or semantic trees");\\n'
              '    semantics_tree_free(sealed_semantics);\\n'
              '    hit_tree_free(sealed_hits);\\n'
              '    display_list_free(sealed_display);\\n'
              '    delete(sealed_semantics);\\n'
              '    delete(sealed_hits);\\n'
              '    delete(sealed_display);\\n'
          ).replace('\\\\n', '\\n')
          contract.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Validate strict Zag v2 Surface contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$ZNC" tools/check-contracts.sh
          "$ZNC" version

          "$ZNC" tests/visual_system_v2_policy_contract.zag \
            --no-zagd --analyze-strict --no-foreground-cache \
            -o /tmp/visual-system-v2-policy
          /tmp/visual-system-v2-policy

          "$ZNC" tests/surface_v2_contract.zag \
            --no-zagd --analyze-strict --no-foreground-cache \
            -o /tmp/surface-v2-contract
          /tmp/surface-v2-contract

          "$ZNC" tests/surface_contract.zag \
            --no-zagd --analyze-strict --no-foreground-cache \
            -o /tmp/surface-contract
          /tmp/surface-contract

          "$ZNC" tests/design_tokens_contract.zag \
            --no-zagd --analyze-strict --no-foreground-cache \
            -o /tmp/design-tokens-contract
          /tmp/design-tokens-contract

          ./tools/check-contracts.sh
          git diff --check

      - name: Commit repair and trigger renderer integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('contracts/toolchain.json')
          data = json.loads(path.read_text())
          evidence = data.setdefault('evidence', [])
          notes = [
              ('ZagKit semantics mutation APIs use ordinary pointer parameters on the '
               'portable Zag v2 path; stale experimental @borrows_mut parameter syntax '
               'was removed after strict arity validation.'),
              ('Strict sealed-destination Surface testing uses explicit heap-owned builder '
               'objects so the v2 lifetime checker can prove that no local aggregate address escapes.'),
          ]
          for note in notes:
              if note not in evidence:
                  evidence.append(note)
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          rm -f .github/run-v2-semantics-repair \
                .github/workflows/repair-v2-semantics-arity.yml

          git config user.name "zagkit-render-bot"
          git config user.email "zagkit-render-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'repair produced no changes'; exit 1; }
          git commit -m "fix: align Surface contracts with strict Zag v2 ownership"
          git push origin HEAD:agent/v2-analytic-shadow-safe
