name: ZagKit v2 visual system

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZNC: ${{ github.workspace }}/.toolchain/zag/zag-poc/znc
    steps:
      - name: Check out ZagKit master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve pinned Zag revision
        id: toolchain
        run: echo "zag_sha=$(jq -r '.zag.commit' contracts/toolchain.json)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Zag toolchain
        uses: actions/checkout@v6
        with:
          repository: Sylorlabs/zag
          ref: ${{ steps.toolchain.outputs.zag_sha }}
          path: .toolchain/zag

      - name: Restore fixed-point Zag compiler
        id: zag-cache
        uses: actions/cache@v5
        with:
          path: |
            .toolchain/zag/zag-poc/znc
            .toolchain/zag/zag-poc/zagd
          key: zag-fixed-${{ runner.os }}-${{ steps.toolchain.outputs.zag_sha }}

      - name: Bootstrap pinned Zag source
        if: steps.zag-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x .toolchain/zag/zag-poc/znc .toolchain/zag/zag-poc/bootstrap.sh
          ZAG_BOOTSTRAP_MEMORY_GUARD=off .toolchain/zag/zag-poc/bootstrap.sh

      - name: Detect foundation state
        id: foundation
        run: |
          if [ -f contracts/visual-system-v2.json ]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply v2 visual foundation
        if: steps.foundation.outputs.apply == 'true'
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          visual_system = r'''@import("tokens.zag")

// ZagKit v2 visual-system contract.
//
// Material role and elevation are intentionally independent. Content-bearing
// surfaces remain solid even when elevated; veil and glass are reserved for
// surfaces that genuinely float over live content. Every shadow derives from
// one scene light and resolves to deterministic fixed-point data shared by CPU
// and future GPU backends.

enum VisualMaterialRole { automatic, solid, veil, glass }
enum VisualSurfaceKind {
    canvas,
    content_panel,
    raised_card,
    floating_chrome,
    transient_overlay,
}
enum VisualTransparency { normal, reduced }

struct VisualEnvironment {
    density: FlexDensity,
    transparency: VisualTransparency,
    high_contrast: i32,
    backdrop_available: i32,
}

struct VisualSceneLight {
    key_azimuth_degrees: i64,
    key_zenith_degrees: i64,
    shadow_direction_x: i64,
    shadow_direction_y: i64,
    ambient_alpha: i64,
    rim_alpha: i64,
}

struct VisualShadowSpec {
    offset_x: i64,
    offset_y: i64,
    blur_radius: i64,
    spread: i64,
    alpha: i64,
}

struct VisualShadowPair {
    contact: VisualShadowSpec,
    ambient: VisualShadowSpec,
}

struct VisualSurfaceEffects {
    requested_role: VisualMaterialRole,
    effective_role: VisualMaterialRole,
    material_token: SemanticMaterialToken,
    fill_token: SemanticColorToken,
    tint_token: SemanticColorToken,
    edge_token: SemanticColorToken,
    radius_token: SemanticRadiusToken,
    elevation_token: SemanticElevationToken,
    tint_alpha: i64,
    blur_radius: i64,
    backdrop_blur_enabled: i32,
    cpu_fallback_reason: []u8,
    shadows: VisualShadowPair,
}

fn visual_flag_valid(value: i32) i32 {
    return (value == 0 || value == 1) as i32;
}

fn visual_material_role_valid(role: VisualMaterialRole) i32 {
    let value: i64 = role as i64;
    return (value >= VisualMaterialRole.automatic as i64 &&
        value <= VisualMaterialRole.glass as i64) as i32;
}

fn visual_surface_kind_valid(kind: VisualSurfaceKind) i32 {
    let value: i64 = kind as i64;
    return (value >= VisualSurfaceKind.canvas as i64 &&
        value <= VisualSurfaceKind.transient_overlay as i64) as i32;
}

fn visual_transparency_valid(value: VisualTransparency) i32 {
    let raw: i64 = value as i64;
    return (raw >= VisualTransparency.normal as i64 &&
        raw <= VisualTransparency.reduced as i64) as i32;
}

fn visual_density_valid(value: FlexDensity) i32 {
    let raw: i64 = value as i64;
    return (raw >= FlexDensity.compact as i64 &&
        raw <= FlexDensity.touch as i64) as i32;
}

fn visual_environment(density: FlexDensity) VisualEnvironment {
    let resolved: FlexDensity = density;
    if (visual_density_valid(resolved) == 0) {
        resolved = FlexDensity.standard;
    }
    return VisualEnvironment{
        .density = resolved,
        .transparency = VisualTransparency.normal,
        .high_contrast = 0,
        .backdrop_available = 0,
    };
}

fn visual_environment_valid(environment: VisualEnvironment) i32 {
    return (visual_density_valid(environment.density) != 0 &&
        visual_transparency_valid(environment.transparency) != 0 &&
        visual_flag_valid(environment.high_contrast) != 0 &&
        visual_flag_valid(environment.backdrop_available) != 0) as i32;
}

fn visual_scene_light() VisualSceneLight {
    return VisualSceneLight{
        .key_azimuth_degrees = 40,
        .key_zenith_degrees = 60,
        .shadow_direction_x = (unit_scale() * 3) / 4,
        .shadow_direction_y = unit_scale(),
        .ambient_alpha = 27525,
        .rim_alpha = 11796,
    };
}

fn visual_default_role(kind: VisualSurfaceKind) VisualMaterialRole {
    if (kind == VisualSurfaceKind.floating_chrome) {
        return VisualMaterialRole.veil;
    }
    if (kind == VisualSurfaceKind.transient_overlay) {
        return VisualMaterialRole.glass;
    }
    return VisualMaterialRole.solid;
}

fn visual_effective_role(kind: VisualSurfaceKind,
    requested: VisualMaterialRole,
    environment: VisualEnvironment) VisualMaterialRole {
    let role: VisualMaterialRole = requested;
    if (visual_material_role_valid(role) == 0 ||
        role == VisualMaterialRole.automatic) {
        role = visual_default_role(kind);
    }
    if (environment.transparency == VisualTransparency.reduced ||
        environment.high_contrast != 0) {
        return VisualMaterialRole.solid;
    }
    if (environment.density == FlexDensity.compact &&
        role == VisualMaterialRole.veil) {
        return VisualMaterialRole.solid;
    }
    return role;
}

fn visual_material_token(role: VisualMaterialRole) SemanticMaterialToken {
    if (role == VisualMaterialRole.veil) {
        return SemanticMaterialToken.veil;
    }
    if (role == VisualMaterialRole.glass) {
        return SemanticMaterialToken.glass;
    }
    return SemanticMaterialToken.solid;
}

fn visual_surface_fill_token(kind: VisualSurfaceKind) SemanticColorToken {
    return switch (kind) {
        .canvas => SemanticColorToken.surface_base,
        .content_panel => SemanticColorToken.surface_panel,
        .raised_card => SemanticColorToken.surface_raised,
        .floating_chrome => SemanticColorToken.surface_panel,
        .transient_overlay => SemanticColorToken.surface_raised,
    };
}

fn visual_surface_radius_token(kind: VisualSurfaceKind) SemanticRadiusToken {
    return switch (kind) {
        .canvas => SemanticRadiusToken.panel,
        .content_panel => SemanticRadiusToken.panel,
        .raised_card => SemanticRadiusToken.card,
        .floating_chrome => SemanticRadiusToken.panel,
        .transient_overlay => SemanticRadiusToken.card,
    };
}

fn visual_surface_edge_token(kind: VisualSurfaceKind,
    elevation: SemanticElevationToken) SemanticColorToken {
    if (kind == VisualSurfaceKind.canvas ||
        elevation == SemanticElevationToken.base) {
        return SemanticColorToken.border_subtle;
    }
    return SemanticColorToken.edge_highlight;
}

fn visual_shadow_spec(offset: i64, blur: i64,
    alpha: i64, light: VisualSceneLight) VisualShadowSpec {
    return VisualShadowSpec{
        .offset_x = (offset * light.shadow_direction_x) / unit_scale(),
        .offset_y = (offset * light.shadow_direction_y) / unit_scale(),
        .blur_radius = blur,
        .spread = 0,
        .alpha = alpha,
    };
}

fn visual_shadow_pair(token: SemanticElevationToken) VisualShadowPair {
    let elevation: ResolvedElevationToken = semantic_elevation(token);
    let light: VisualSceneLight = visual_scene_light();
    return VisualShadowPair{
        .contact = visual_shadow_spec(elevation.contact_shadow_y,
            elevation.contact_shadow_blur,
            elevation.contact_shadow_alpha, light),
        .ambient = visual_shadow_spec(elevation.ambient_shadow_y,
            elevation.ambient_shadow_blur,
            elevation.ambient_shadow_alpha, light),
    };
}

fn visual_surface_effects(kind: VisualSurfaceKind,
    requested: VisualMaterialRole,
    elevation_token: SemanticElevationToken,
    raw_environment: VisualEnvironment) VisualSurfaceEffects {
    let environment: VisualEnvironment = raw_environment;
    if (visual_environment_valid(environment) == 0) {
        environment = visual_environment(FlexDensity.standard);
    }
    let safe_kind: VisualSurfaceKind = kind;
    if (visual_surface_kind_valid(safe_kind) == 0) {
        safe_kind = VisualSurfaceKind.content_panel;
    }
    let safe_requested: VisualMaterialRole = requested;
    if (visual_material_role_valid(safe_requested) == 0) {
        safe_requested = VisualMaterialRole.automatic;
    }
    let role: VisualMaterialRole = visual_effective_role(
        safe_kind, safe_requested, environment);
    let material_token: SemanticMaterialToken = visual_material_token(role);
    let material: ResolvedMaterialToken = semantic_material(material_token);
    let tint_alpha: i64 = material.tint_alpha_end;
    let blur_radius: i64 = material.blur_radius;
    if (role == VisualMaterialRole.solid) {
        tint_alpha = 0;
        blur_radius = 0;
    }
    let backdrop: i32 = (role != VisualMaterialRole.solid &&
        environment.backdrop_available != 0) as i32;
    return VisualSurfaceEffects{
        .requested_role = safe_requested,
        .effective_role = role,
        .material_token = material_token,
        .fill_token = visual_surface_fill_token(safe_kind),
        .tint_token = material.tint_token,
        .edge_token = visual_surface_edge_token(safe_kind, elevation_token),
        .radius_token = visual_surface_radius_token(safe_kind),
        .elevation_token = elevation_token,
        .tint_alpha = tint_alpha,
        .blur_radius = blur_radius,
        .backdrop_blur_enabled = backdrop,
        .cpu_fallback_reason = material.cpu_fallback_reason,
        .shadows = visual_shadow_pair(elevation_token),
    };
}

fn visual_viewport_area(viewport: Size) i64 {
    if (viewport.width <= 0 || viewport.height <= 0) { return 0; }
    if (viewport.width > 1000000 * unit_scale() ||
        viewport.height > 1000000 * unit_scale()) { return 0; }
    return (viewport.width / unit_scale()) *
        (viewport.height / unit_scale());
}

fn visual_veil_area_budget(viewport: Size) i64 {
    return visual_viewport_area(viewport) / 4;
}

fn visual_glass_layer_budget() i32 { return 1; }

// Values are contrast ratios multiplied by 1000.
fn visual_text_contrast_floor(role: VisualMaterialRole) i64 {
    if (role == VisualMaterialRole.veil || role == VisualMaterialRole.glass) {
        return 7000;
    }
    return 4500;
}
'''

          visual_test = r'''@import("../src/design/visual_system_v2.zag")
@import("../src/render/cpu_raster.zag")
@import("../src/render/display_list_codec.zag")

struct TestState { passed: i32, failed: i32 }

fn expect(state: *TestState, condition: i32, name: []u8) void {
    if (condition != 0) {
        state.*.passed = state.*.passed + 1;
        _zag_print("ok  "); _zag_println(name);
    } else {
        state.*.failed = state.*.failed + 1;
        _zag_print("FAIL "); _zag_println(name);
    }
}

fn pixel(surface: CpuSurface, x: i32, y: i32, channel: i32) i64 {
    return surface.pixels.data[(y * surface.width + x) * 4 + channel] as i64;
}

fn material_contract(state: *TestState) void {
    let standard: VisualEnvironment = visual_environment(FlexDensity.standard);
    let compact: VisualEnvironment = visual_environment(FlexDensity.compact);
    let panel: VisualSurfaceEffects = visual_surface_effects(
        VisualSurfaceKind.content_panel, VisualMaterialRole.automatic,
        SemanticElevationToken.panel, standard);
    let card: VisualSurfaceEffects = visual_surface_effects(
        VisualSurfaceKind.raised_card, VisualMaterialRole.automatic,
        SemanticElevationToken.raised, standard);
    let chrome: VisualSurfaceEffects = visual_surface_effects(
        VisualSurfaceKind.floating_chrome, VisualMaterialRole.automatic,
        SemanticElevationToken.panel, standard);
    let compact_chrome: VisualSurfaceEffects = visual_surface_effects(
        VisualSurfaceKind.floating_chrome, VisualMaterialRole.automatic,
        SemanticElevationToken.panel, compact);
    let overlay: VisualSurfaceEffects = visual_surface_effects(
        VisualSurfaceKind.transient_overlay, VisualMaterialRole.automatic,
        SemanticElevationToken.overlay, standard);

    expect(state, panel.effective_role == VisualMaterialRole.solid &&
        panel.fill_token == SemanticColorToken.surface_panel &&
        panel.material_token == SemanticMaterialToken.solid,
        "content panels remain solid while preserving panel luminance");
    expect(state, card.effective_role == VisualMaterialRole.solid &&
        card.fill_token == SemanticColorToken.surface_raised &&
        card.radius_token == SemanticRadiusToken.card,
        "raised cards use elevation without pretending to be translucent");
    expect(state, chrome.effective_role == VisualMaterialRole.veil &&
        chrome.blur_radius == 20 * unit_scale() &&
        chrome.tint_alpha > 0,
        "floating chrome resolves to bounded veil material");
    expect(state, compact_chrome.effective_role == VisualMaterialRole.solid &&
        compact_chrome.blur_radius == 0,
        "compact density demotes persistent veil to efficient solid chrome");
    expect(state, overlay.effective_role == VisualMaterialRole.glass &&
        overlay.blur_radius == 36 * unit_scale() &&
        visual_text_contrast_floor(overlay.effective_role) == 7000,
        "transient overlays alone receive full glass treatment and stronger contrast");

    let reduced: VisualEnvironment = standard;
    reduced.transparency = VisualTransparency.reduced;
    let reduced_overlay: VisualSurfaceEffects = visual_surface_effects(
        VisualSurfaceKind.transient_overlay, VisualMaterialRole.automatic,
        SemanticElevationToken.overlay, reduced);
    expect(state, reduced_overlay.effective_role == VisualMaterialRole.solid &&
        reduced_overlay.blur_radius == 0 && reduced_overlay.tint_alpha == 0,
        "reduced transparency is a deterministic material demotion");

    let high: VisualEnvironment = standard;
    high.high_contrast = 1;
    let high_chrome: VisualSurfaceEffects = visual_surface_effects(
        VisualSurfaceKind.floating_chrome, VisualMaterialRole.automatic,
        SemanticElevationToken.panel, high);
    expect(state, high_chrome.effective_role == VisualMaterialRole.solid,
        "high contrast removes variable translucent backdrops");

    let shadows: VisualShadowPair = visual_shadow_pair(
        SemanticElevationToken.raised);
    expect(state, shadows.contact.offset_x > 0 &&
        shadows.contact.offset_y > shadows.contact.offset_x &&
        shadows.ambient.blur_radius > shadows.contact.blur_radius &&
        shadows.ambient.alpha < shadows.contact.alpha,
        "one scene light derives coherent contact and ambient shadows");
    expect(state, visual_veil_area_budget(size(1200 * unit_scale(),
            800 * unit_scale())) == 240000 &&
        visual_glass_layer_budget() == 1,
        "veil area and glass-layer work remain explicitly bounded");
}

fn shadow_scene() DisplayList {
    let list: DisplayList = display_list_make();
    let shadow: DisplayOp = display_op(
        DisplayOpKind.fill_rounded_shadow, node_key(700));
    shadow.bounds = rect(10 * unit_scale(), 10 * unit_scale(),
        20 * unit_scale(), 20 * unit_scale());
    shadow.parameter = 6 * unit_scale();
    shadow.paint = paint_rgba16(0, 0, 0, 36000);
    shadow.paint.stroke_width = 6 * unit_scale();
    _ = display_list_push(&list, shadow);

    let fill: DisplayOp = display_op(
        DisplayOpKind.fill_rounded_rect, node_key(700));
    fill.bounds = shadow.bounds;
    fill.parameter = shadow.parameter;
    fill.paint = paint_rgba16(56000, 58000, 62000, 65535);
    _ = display_list_push(&list, fill);
    _ = display_list_seal(&list);
    return list;
}

fn analytic_shadow_contract(state: *TestState) void {
    let list: DisplayList = shadow_scene();
    let first: CpuRasterResult = cpu_rasterize(list, 40, 40);
    let second: CpuRasterResult = cpu_rasterize(list, 40, 40);
    expect(state, first.error == CpuRasterError.none &&
        first.rendered_ops == 2 && first.pixels_touched > 400,
        "CPU oracle executes analytic rounded shadows as bounded display work");
    expect(state, pixel(first.surface, 20, 20, 3) == 255 &&
        pixel(first.surface, 20, 34, 3) > 0 &&
        pixel(first.surface, 20, 34, 3) < 255 &&
        pixel(first.surface, 20, 39, 3) == 0,
        "shadow falloff is soft near the surface and reaches exact zero outside support");
    expect(state, cpu_surface_hash(first.surface) ==
        cpu_surface_hash(second.surface),
        "analytic shadow pixels are deterministic across identical renders");

    let encoded: DisplayEncodeResult = display_list_encode(list);
    let decoded: DisplayDecodeResult = display_list_decode(encoded.bytes);
    expect(state, encoded.error == DisplayCodecError.none &&
        decoded.error == DisplayCodecError.none &&
        decoded.list.ops.data[0].kind == DisplayOpKind.fill_rounded_shadow &&
        decoded.list.ops.data[0].paint.stroke_width == 6 * unit_scale(),
        "display-list transport preserves shadow kind radius blur and identity");

    display_decode_free(&decoded);
    display_encode_free(&encoded);
    cpu_raster_free(&second);
    cpu_raster_free(&first);
    display_list_free(&list);
}

fn rejection_contract(state: *TestState) void {
    let list: DisplayList = display_list_make();
    let shadow: DisplayOp = display_op(
        DisplayOpKind.fill_rounded_shadow, node_key(701));
    shadow.bounds = rect(0, 0, 20 * unit_scale(), 20 * unit_scale());
    shadow.parameter = 6 * unit_scale();
    shadow.paint.stroke_width = 0;
    expect(state, display_list_push(&list, shadow) ==
        DisplayError.invalid_parameter && list.ops.len == 0,
        "zero-blur shadow operations fail before display-list mutation");
    shadow.paint.stroke_width = 300 * unit_scale();
    expect(state, display_list_push(&list, shadow) ==
        DisplayError.invalid_parameter && list.ops.len == 0,
        "unbounded shadow support is rejected before raster work");
    display_list_free(&list);
}

fn main() i32 {
    let state: TestState = TestState{ .passed = 0, .failed = 0 };
    material_contract(&state);
    analytic_shadow_contract(&state);
    rejection_contract(&state);
    let passed: []u8 = _zag_i64_to_str(state.passed as i64);
    let failed: []u8 = _zag_i64_to_str(state.failed as i64);
    _zag_print("ZagKit v2 visual contract: pass="); _zag_print(passed);
    _zag_print(" fail="); _zag_println(failed);
    _zag_str_free(passed);
    _zag_str_free(failed);
    if (state.failed == 0) { return 0; }
    return 1;
}
'''

          visual_doc = r'''# ZagKit v2 visual-system contract

Status: **active foundation**

This contract upgrades ZagKit's visual layer without replacing its retained
identity, state, reconciliation, Flex, semantics, input, replay, or display-list
architecture.

## Product rule

ZagKit v2 separates **material role** from **elevation**:

- canvases, content panels, cards, tables, editors, and form fields are solid;
- persistent chrome may use a bounded veil only while floating over live content;
- transient menus, popovers, command palettes, and dialogs may use glass;
- compact density demotes veil to solid;
- reduced transparency and high contrast demote all translucency to solid;
- one scene light derives every contact shadow, ambient shadow, and edge cue.

## Rendering contract

`fill_rounded_shadow` is the first native analytic effect operation. Its
`bounds` and `parameter` describe the source rounded rectangle; paint alpha owns
shadow opacity and `paint.stroke_width` owns the finite blur support radius.
The operation allocates no temporary image, has a hard blur limit, participates
in deterministic display identity and codec transport, and is implemented by
the CPU oracle with fixed-point signed-distance falloff.

Future GPU backends must consume the same operation and remain within the
published CPU tolerance. They may accelerate evaluation but may not reinterpret
the material system.

## Efficiency gates

- veil area is limited to 25% of the viewport;
- one live glass layer is allowed per interaction;
- shadow work is clipped to blur-expanded damage bounds;
- dense compact interfaces pay no persistent backdrop-sampling cost;
- unsupported backdrop blur uses the explicit deterministic CPU fallback;
- idle material and shadow state requests no frames.
'''

