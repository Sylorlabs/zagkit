//   overlay → glass: same material as raised but the surface_tier_elevation
//            mapping selects SemanticElevationToken.overlay, producing
//            deeper shadows.  No separate overlay material is needed
//            because the elevation token already differentiates the two.
fn surface_material_token(tier: SurfaceTier) SemanticMaterialToken {
    if (surface_tier_valid(tier) == 0) {
        return SemanticMaterialToken.solid;
    }
    return switch (tier) {
        .base => SemanticMaterialToken.solid,
        .panel => SemanticMaterialToken.veil,
        .raised => SemanticMaterialToken.glass,
        .overlay => SemanticMaterialToken.glass,
    };
}
