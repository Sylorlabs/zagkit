          "$ZNC" tests/display_list_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/display-list-contract
          /tmp/display-list-contract
          "$ZNC" tests/display_list_codec_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/display-list-codec-contract
          /tmp/display-list-codec-contract
          "$ZNC" tests/cpu_raster_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/cpu-raster-contract
          /tmp/cpu-raster-contract

      - name: Run complete strict headless gate
        run: |
          chmod +x tools/test-headless.sh tools/check-contracts.sh
          ./tools/test-headless.sh
          ./tools/check-contracts.sh
          git diff --check

      - name: Commit verified foundation
        if: steps.foundation.outputs.apply == 'true'
        run: |
          git config user.name "zagkit-visual-bot"
          git config user.email "zagkit-visual-bot@users.noreply.github.com"
          git add src tests tools docs contracts
          git commit -m "feat: establish ZagKit v2 visual effects foundation"
          git push origin HEAD:master
