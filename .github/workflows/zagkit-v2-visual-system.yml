          shadow_functions = r'''
fn cpu_abs(value: i64) i64 {
    if (value < 0) { return 0 - value; }
    return value;
}

fn cpu_max(left: i64, right: i64) i64 {
    if (left > right) { return left; }
    return right;
}

fn cpu_isqrt(value: i64) i64 {
    if (value <= 0) { return 0; }
    let result: i64 = value;
    let next: i64 = (result + 1) / 2;
    while (next < result) {
        result = next;
        next = (result + value / result) / 2;
    }
    return result;
}

fn cpu_rounded_signed_distance(bounds: Rect, radius: i64,
    x: i64, y: i64) i64 {
    let half_width: i64 = bounds.width / 2;
    let half_height: i64 = bounds.height / 2;
    let center_x: i64 = bounds.x + half_width;
    let center_y: i64 = bounds.y + half_height;
    let inner_x: i64 = half_width - radius;
    let inner_y: i64 = half_height - radius;
    let qx: i64 = cpu_abs(x - center_x) - inner_x;
    let qy: i64 = cpu_abs(y - center_y) - inner_y;
    let outside_x: i64 = cpu_max(qx, 0);
    let outside_y: i64 = cpu_max(qy, 0);
    let outside: i64 = cpu_isqrt(outside_x * outside_x +
        outside_y * outside_y);
    let inside: i64 = cpu_max(qx, qy);
    if (inside > 0) { inside = 0; }
    return outside + inside - radius;
}

fn cpu_shadow_coverage(distance: i64, blur_radius: i64) i64 {
    if (distance <= 0) { return 4096; }
    if (distance >= blur_radius || blur_radius <= 0) { return 0; }
    let progress: i64 = ((blur_radius - distance) * 4096) /
        blur_radius;
    let numerator: i64 = progress * progress *
        (3 * 4096 - 2 * progress);
    return (numerator + (4096 * 4096) / 2) /
        (4096 * 4096);
}

fn cpu_fill_rounded_shadow(surface: *CpuSurface, raw_bounds: Rect,
    raw_radius: i64, clip: Rect, transform: Transform,
    paint: Paint) CpuRasterResult {
    let shape: Rect = cpu_transform_rect(raw_bounds, transform);
    let scale: i64 = transform.scale_x;
    if (transform.scale_y < scale) { scale = transform.scale_y; }
    let radius: i64 = (raw_radius * scale) / unit_scale();
    let blur_radius: i64 = (paint.stroke_width * scale) /
        unit_scale();
    if (shape.width <= 0 || shape.height <= 0 || radius <= 0 ||
        radius * 2 > shape.width || radius * 2 > shape.height ||
        blur_radius <= 0 || blur_radius > 256 * unit_scale()) {
        return cpu_result(surface.*, CpuRasterError.invalid_geometry,
            0 - 1, 0, 0);
    }
    let expanded: Rect = rect(shape.x - blur_radius,
        shape.y - blur_radius, shape.width + blur_radius * 2,
        shape.height + blur_radius * 2);
    let bounds: Rect = cpu_rect_intersection(
        cpu_rect_intersection(expanded, clip),
        rect(0, 0, (surface.*.width as i64) * unit_scale(),
            (surface.*.height as i64) * unit_scale())
    );
    if (bounds.width <= 0 || bounds.height <= 0) {
        return cpu_result(surface.*, CpuRasterError.none, 0 - 1, 0, 0);
    }
    let first_x: i32 = (bounds.x / unit_scale()) as i32;
    let first_y: i32 = (bounds.y / unit_scale()) as i32;
    let last_x: i32 = ((bounds.x + bounds.width + unit_scale() - 1) /
        unit_scale()) as i32;
    let last_y: i32 = ((bounds.y + bounds.height + unit_scale() - 1) /
        unit_scale()) as i32;
    let pixel_count: i64 = ((last_x - first_x) as i64) *
        ((last_y - first_y) as i64);
    if (pixel_count <= 0 || pixel_count > 50000000) {
        return cpu_result(surface.*, CpuRasterError.work_limit,
            0 - 1, 0, 0);
    }
    let touched: i64 = 0;
    let y: i32 = first_y;
    while (y < last_y) {
        let x: i32 = first_x;
        while (x < last_x) {
            let point_x: i64 = (x as i64) * unit_scale() +
                unit_scale() / 2;
            let point_y: i64 = (y as i64) * unit_scale() +
                unit_scale() / 2;
            let distance: i64 = cpu_rounded_signed_distance(
                shape, radius, point_x, point_y);
            let coverage: i64 = cpu_shadow_coverage(distance,
                blur_radius);
            if (coverage > 0) {
                cpu_blend_pixel(surface, x, y, paint, coverage);
                touched = touched + 1;
            }
            x = x + 1;
        }
        y = y + 1;
    }
    return cpu_result(surface.*, CpuRasterError.none,
        0 - 1, 0, touched);
}
