name: Launch ZagKit v2 foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zagkit-v2-launcher.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZNC: ${{ github.workspace }}/.toolchain/zag/zag-poc/znc
    steps:
      - name: Check out ZagKit master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve pinned Zag revision
        id: toolchain
        run: echo "zag_sha=$(jq -r '.zag.commit' contracts/toolchain.json)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Zag toolchain
        uses: actions/checkout@v6
        with:
          repository: Sylorlabs/zag
          ref: ${{ steps.toolchain.outputs.zag_sha }}
          path: .toolchain/zag

      - name: Restore fixed-point Zag compiler
        id: zag-cache
        uses: actions/cache@v5
        with:
          path: |
            .toolchain/zag/zag-poc/znc
            .toolchain/zag/zag-poc/zagd
          key: zag-fixed-${{ runner.os }}-${{ steps.toolchain.outputs.zag_sha }}

      - name: Bootstrap pinned Zag source
        if: steps.zag-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x .toolchain/zag/zag-poc/znc .toolchain/zag/zag-poc/bootstrap.sh
          ZAG_BOOTSTRAP_MEMORY_GUARD=off .toolchain/zag/zag-poc/bootstrap.sh

      - name: Extract and apply audited foundation patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/zagkit-v2-visual-system.yml').read_text().splitlines()
          start = None
          end = None
          for index, line in enumerate(workflow):
              if line.strip() == "python3 <<'PY'":
                  start = index + 1
                  continue
              if start is not None and line.strip() == 'PY':
                  end = index
                  break
          if start is None or end is None or end <= start:
              raise SystemExit('could not locate audited foundation patch')
          lines = workflow[start:end]
          minimum = min(len(line) - len(line.lstrip()) for line in lines if line.strip())
          patch = '\n'.join(line[minimum:] if line.strip() else '' for line in lines) + '\n'
          Path('/tmp/apply-zagkit-v2.py').write_text(patch)
          PY
          python3 /tmp/apply-zagkit-v2.py

      - name: Run focused Zag v2 visual contracts
        run: |
          chmod +x "$ZNC"
          "$ZNC" tests/visual_system_v2_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/visual-system-v2-contract
          /tmp/visual-system-v2-contract
          "$ZNC" tests/surface_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/surface-contract
          /tmp/surface-contract
          "$ZNC" tests/display_list_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/display-list-contract
          /tmp/display-list-contract
          "$ZNC" tests/display_list_codec_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/display-list-codec-contract
          /tmp/display-list-codec-contract
          "$ZNC" tests/cpu_raster_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/cpu-raster-contract
          /tmp/cpu-raster-contract

      - name: Run complete strict headless gate
        run: |
          chmod +x tools/test-headless.sh tools/check-contracts.sh
          ./tools/test-headless.sh
          ./tools/check-contracts.sh
          git diff --check

      - name: Commit verified native foundation
        run: |
          git config user.name "zagkit-visual-bot"
          git config user.email "zagkit-visual-bot@users.noreply.github.com"
          git add src tests tools docs contracts
          if git diff --cached --quiet; then
            echo "Verified foundation already present"
            exit 0
          fi
          git commit -m "feat: establish ZagKit v2 visual effects foundation"
          git push origin HEAD:master
