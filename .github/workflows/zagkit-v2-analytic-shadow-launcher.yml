              headless = headless.replace(
                  "analytic rounded geometry, CPU shape and image raster",
                  "analytic rounded geometry, constant-operation soft shadows, CPU shape and image raster",
                  1,
              )
              headless_path.write_text(headless)

          validate_path = Path(".github/workflows/zagkit-v2-validate.yml")
          validate = validate_path.read_text()
          if "analytic_shadow_contract.zag" not in validate:
              anchor = '''      - name: Preserve canonical component contracts
        run: |'''
              step = '''      - name: Compile and run analytic shadow contract
        run: |
          "$ZNC" tests/analytic_shadow_contract.zag \\
            --no-zagd --analyze-strict --no-foreground-cache \\
            -o /tmp/analytic-shadow-contract
          /tmp/analytic-shadow-contract

'''
              if anchor not in validate:
                  raise SystemExit("validate workflow: insertion anchor missing")
              validate = validate.replace(anchor, step + anchor, 1)
              validate_path.write_text(validate)
          PY

      - name: Run focused native Zag v2 contracts
        run: |
          chmod +x "$ZNC"
          "$ZNC" tests/analytic_shadow_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/analytic-shadow-contract
          /tmp/analytic-shadow-contract
          "$ZNC" tests/surface_v2_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/surface-v2-contract
          /tmp/surface-v2-contract
          "$ZNC" tests/display_list_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/display-list-contract
          /tmp/display-list-contract
          "$ZNC" tests/display_list_codec_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/display-list-codec-contract
          /tmp/display-list-codec-contract
          "$ZNC" tests/cpu_raster_contract.zag --no-zagd --analyze-strict --no-foreground-cache -o /tmp/cpu-raster-contract
          /tmp/cpu-raster-contract

      - name: Run complete deterministic headless and contract gates
        run: |
          chmod +x tools/test-headless.sh tools/check-contracts.sh
          ./tools/test-headless.sh
          ./tools/check-contracts.sh
          git diff --check

      - name: Commit verified analytic shadow slice
        run: |
          git config user.name "zagkit-visual-bot"
          git config user.email "zagkit-visual-bot@users.noreply.github.com"
          git add src tests tools docs .github/workflows/zagkit-v2-validate.yml
          if git diff --cached --quiet; then
            echo "Analytic shadow slice already present"
            exit 0
          fi
          git commit -m "feat: add constant-operation analytic soft shadows"
          git push origin HEAD:master
