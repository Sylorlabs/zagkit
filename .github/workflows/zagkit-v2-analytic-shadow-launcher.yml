          doc = r'''# Analytic rounded shadows

Status: experimental ZagKit v2 render contract.

ZagKit represents each elevation lobe as one retained
`fill_rounded_shadow` display operation. A normal elevated surface therefore
uses exactly two shadow operations: one contact lobe and one ambient lobe.
This replaces the previous seven expanded rounded-rectangle bands.

## Operation encoding

- `bounds` is the shifted rounded rectangle casting the shadow.
- `parameter` is its logical corner radius.
- `paint` owns RGBA16 shadow color and opacity.
- `paint.stroke_width` owns the logical blur radius for this operation.
- spread is resolved into bounds and radius before recording.
- `resource_id` remains zero; the operation does not own an external resource.

The display-list validator rejects zero or excessive blur, empty geometry,
invalid radius, invisible no-ops, and noncanonical resource identity before
mutation. Codec version 4 round-trips the operation without changing the fixed
160-byte operation record.

## CPU oracle

The deterministic CPU path evaluates a rounded-rectangle signed distance with
a fixed-point octagonal radial approximation and quadratic alpha falloff. It
uses no temporary image, Gaussian pass, hidden allocation, or recursive blur.
Work is bounded by the clipped expanded pixel extent and fails visibly above
the shadow work limit.

The CPU oracle is the semantic reference for future GPU implementations. GPU
backends may use a native distance-field shader, but must consume the same
operation parameters and remain within the declared visual tolerance.

## Performance contract

A raised `SurfaceV2` records two shadow operations regardless of blur radius.
Compact or flattened surfaces record none. The operation count is therefore
constant per elevated surface and independent of visual softness.

Run:

```sh
./tools/test-headless.sh
```

The `analytic_shadow_contract.zag` gate verifies validation, smooth ordered
falloff, byte-stable raster output, codec identity, and SurfaceV2 integration.
'''
