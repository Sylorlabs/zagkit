fn pixel_alpha(surface: CpuSurface, x: i32, y: i32) i64 {
    return surface.pixels.data[(y * surface.width + x) * 4 + 3] as i64;
}

fn shadow_op(owner: NodeKey) DisplayOp {
    let op: DisplayOp = display_op(
        DisplayOpKind.fill_rounded_shadow, owner);
    op.bounds = rect(16 * unit_scale(), 16 * unit_scale(),
        32 * unit_scale(), 32 * unit_scale());
    op.parameter = 8 * unit_scale();
    op.paint = paint_rgba16(0, 0, 0, 36000);
    op.paint.stroke_width = 12 * unit_scale();
    return op;
}

fn display_and_raster_contract(state: *TestState) void {
    let list: DisplayList = display_list_make();
    let op: DisplayOp = shadow_op(node_key(7000));
    expect(state,
        display_list_push(&list, op) == DisplayError.none &&
        list.ops.len == 1 &&
        list.ops.data[0].kind == DisplayOpKind.fill_rounded_shadow,
        "one retained operation represents one complete analytic shadow lobe");
    expect(state,
        display_list_seal(&list) == DisplayError.none &&
        display_list_verify(list) == DisplayError.none,
        "analytic shadow operation seals into deterministic render IR");

    let first: CpuRasterResult = cpu_rasterize(list, 64, 64);
    let second: CpuRasterResult = cpu_rasterize(list, 64, 64);
    let center_alpha: i64 = pixel_alpha(first.surface, 32, 32);
    let near_alpha: i64 = pixel_alpha(first.surface, 10, 32);
    let far_alpha: i64 = pixel_alpha(first.surface, 2, 32);
    expect(state,
        first.error == CpuRasterError.none &&
        first.rendered_ops == 1 && first.pixels_touched > 0,
        "CPU oracle renders the soft shadow in one bounded operation");
    expect(state,
        center_alpha > near_alpha && near_alpha > far_alpha &&
        far_alpha == 0,
        "quadratic analytic falloff is smooth ordered and reaches transparent zero");
    expect(state,
        cpu_surface_hash(first.surface) == cpu_surface_hash(second.surface) &&
        first.pixels_touched == second.pixels_touched,
        "identical shadow inputs produce byte-stable CPU output and work counts");

    let encoded: DisplayEncodeResult = display_list_encode(list);
    let decoded: DisplayDecodeResult = display_list_decode(encoded.bytes);
    expect(state,
        encoded.error == DisplayCodecError.none &&
        decoded.error == DisplayCodecError.none &&
        decoded.list.ops.len == 1 &&
        decoded.list.ops.data[0].kind ==
            DisplayOpKind.fill_rounded_shadow &&
        decoded.list.ops.data[0].paint.stroke_width ==
            12 * unit_scale() &&
        decoded.list.content_hash == list.content_hash,
        "codec v4 preserves analytic shadow radius blur ownership and identity");

    display_decode_free(&decoded);
    display_encode_free(&encoded);
    cpu_raster_free(&second);
    cpu_raster_free(&first);
    display_list_free(&list);
}

fn rejection_contract(state: *TestState) void {
    let list: DisplayList = display_list_make();
    let zero_blur: DisplayOp = shadow_op(node_key(7100));
    zero_blur.paint.stroke_width = 0;
    expect(state,
        display_list_push(&list, zero_blur) ==
            DisplayError.invalid_parameter && list.ops.len == 0,
        "zero blur cannot enter the canonical shadow stream");

    let huge_blur: DisplayOp = shadow_op(node_key(7101));
    huge_blur.paint.stroke_width = 257 * unit_scale();
    expect(state,
        display_list_push(&list, huge_blur) ==
            DisplayError.invalid_parameter && list.ops.len == 0,
        "unbounded blur is rejected before display-list mutation");

    let invisible: DisplayOp = shadow_op(node_key(7102));
    invisible.paint.alpha = 0;
    expect(state,
        display_list_push(&list, invisible) ==
            DisplayError.invalid_parameter && list.ops.len == 0,
        "fully transparent shadow no-ops are rejected for canonical identity");
    display_list_free(&list);
}

fn surface_integration_contract(state: *TestState) void {
    let display: DisplayList = display_list_make();
    let hits: HitTree = hit_tree_make();
    let semantics: SemanticsTree = semantics_tree_make();
    let spec: SurfaceV2Spec = surface_v2_spec(
        node_key(7200), hit_root_key(),
        rect(32 * unit_scale(), 32 * unit_scale(),
            240 * unit_scale(), 88 * unit_scale()),
        "Analytic raised card", VisualSurfaceKind.raised_card);
    let built: SurfaceV2BuildResult = surface_v2_emit(
        spec, &display, &hits, &semantics);
    expect(state,
        built.error == SurfaceBuildError.none &&
        built.artifact.shadow_operations == 2 &&
        display.ops.len >= 2 &&
        display.ops.data[0].kind ==
            DisplayOpKind.fill_rounded_shadow &&
        display.ops.data[1].kind ==
            DisplayOpKind.fill_rounded_shadow,
        "SurfaceV2 emits exactly one ambient and one contact shadow operation");
    expect(state,
        display_list_seal(&display) == DisplayError.none,
        "SurfaceV2 analytic shadow scene seals before rendering");
    let rendered: CpuRasterResult = cpu_rasterize(display, 320, 160);
    expect(state,
        rendered.error == CpuRasterError.none &&
        rendered.rendered_ops == display.ops.len &&
        rendered.pixels_touched > 0,
        "integrated modern surface renders through the deterministic CPU oracle");

    cpu_raster_free(&rendered);
    semantics_tree_free(&semantics);
    hit_tree_free(&hits);
    display_list_free(&display);
}

fn main() i32 {
    let state: TestState = TestState{ .passed = 0, .failed = 0 };
    display_and_raster_contract(&state);
    rejection_contract(&state);
    surface_integration_contract(&state);
    _zag_print("Analytic shadow contract: pass=");
    _zag_print_i64(state.passed as i64);
    _zag_print(" fail=");
    _zag_print_i64(state.failed as i64);
    _zag_println("");
    if (state.failed == 0) { return 0; }
    return 1;
}
