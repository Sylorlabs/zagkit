name: Launch ZagKit v2 analytic shadows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zagkit-v2-analytic-shadow-launcher.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZNC: ${{ github.workspace }}/.toolchain/zag/zag-poc/znc
    steps:
      - name: Check out ZagKit master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve pinned Zag revision
        id: toolchain
        run: echo "zag_sha=$(jq -r '.zag.commit' contracts/toolchain.json)" >> "$GITHUB_OUTPUT"

      - name: Check out exact Zag toolchain
        uses: actions/checkout@v6
        with:
          repository: Sylorlabs/zag
          ref: ${{ steps.toolchain.outputs.zag_sha }}
          path: .toolchain/zag

      - name: Restore pinned compiler seed
        id: zag-cache
        uses: actions/cache@v5
        with:
          path: |
            .toolchain/zag/zag-poc/znc
            .toolchain/zag/zag-poc/zagd
          key: zag-fixed-${{ runner.os }}-${{ steps.toolchain.outputs.zag_sha }}

      - name: Bootstrap pinned Zag source
        if: steps.zag-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x .toolchain/zag/zag-poc/znc .toolchain/zag/zag-poc/bootstrap.sh
          ZAG_BOOTSTRAP_MEMORY_GUARD=off .toolchain/zag/zag-poc/bootstrap.sh

      - name: Apply analytic shadow render slice
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement, found {count}: {old[:100]!r}"
                  )
              file.write_text(text.replace(old, new, 1))

          display_path = Path("src/render/display_list.zag")
          display = display_path.read_text()
          if "fill_rounded_shadow" not in display:
              replace_once(
                  str(display_path),
                  "    apply_effect,\n    fill_rounded_rect,\n}",
                  "    apply_effect,\n    fill_rounded_rect,\n    fill_rounded_shadow,\n}",
              )
              replace_once(
                  str(display_path),
                  "        .fill_rounded_rect => 0 - 1,\n    };",
                  "        .fill_rounded_rect => 0 - 1,\n        .fill_rounded_shadow => 0 - 1,\n    };",
              )
              replace_once(
                  str(display_path),
                  "    return (kind == DisplayOpKind.clip_rect || kind == DisplayOpKind.fill_rect ||\n        kind == DisplayOpKind.fill_rounded_rect ||\n        kind == DisplayOpKind.stroke_rect || kind == DisplayOpKind.draw_image ||",
                  "    return (kind == DisplayOpKind.clip_rect || kind == DisplayOpKind.fill_rect ||\n        kind == DisplayOpKind.fill_rounded_rect ||\n        kind == DisplayOpKind.fill_rounded_shadow ||\n        kind == DisplayOpKind.stroke_rect || kind == DisplayOpKind.draw_image ||",
              )
              replace_once(
                  str(display_path),
                  "    if (op.kind == DisplayOpKind.fill_rounded_rect &&\n        (op.parameter <= 0 || op.parameter * 2 > op.bounds.width ||\n         op.parameter * 2 > op.bounds.height)) {\n        return display_fail(list, DisplayError.invalid_parameter);\n    }",
                  "    if ((op.kind == DisplayOpKind.fill_rounded_rect ||\n         op.kind == DisplayOpKind.fill_rounded_shadow) &&\n        (op.parameter <= 0 || op.parameter * 2 > op.bounds.width ||\n         op.parameter * 2 > op.bounds.height)) {\n        return display_fail(list, DisplayError.invalid_parameter);\n    }\n    if (op.kind == DisplayOpKind.fill_rounded_shadow &&\n        (op.paint.stroke_width <= 0 ||\n         op.paint.stroke_width > 256 * unit_scale() ||\n         op.paint.alpha <= 0 || op.resource_id != 0)) {\n        return display_fail(list, DisplayError.invalid_parameter);\n    }",
