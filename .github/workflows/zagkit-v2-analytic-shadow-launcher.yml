}

fn cpu_shadow_abs(value: i64) i64 {
    if (value < 0) { return 0 - value; }
    return value;
}

// Deterministic octagonal approximation of Euclidean distance. The maximum
// error is small enough for a soft alpha falloff while avoiding a square root
// in the frame-hot CPU oracle.
fn cpu_shadow_radial_distance(dx: i64, dy: i64) i64 {
    let high: i64 = dx;
    let low: i64 = dy;
    if (low > high) {
        let swap: i64 = high;
        high = low;
        low = swap;
    }
    return high + (low * 3) / 8;
}

fn cpu_rounded_signed_distance(bounds: Rect, radius: i64,
    x: i64, y: i64) i64 {
    let inner_left: i64 = bounds.x + radius;
    let inner_right: i64 = bounds.x + bounds.width - radius;
    let inner_top: i64 = bounds.y + radius;
    let inner_bottom: i64 = bounds.y + bounds.height - radius;
    let nearest_x: i64 = x;
    let nearest_y: i64 = y;
    if (nearest_x < inner_left) { nearest_x = inner_left; }
    if (nearest_x > inner_right) { nearest_x = inner_right; }
    if (nearest_y < inner_top) { nearest_y = inner_top; }
    if (nearest_y > inner_bottom) { nearest_y = inner_bottom; }
    let dx: i64 = cpu_shadow_abs(x - nearest_x);
    let dy: i64 = cpu_shadow_abs(y - nearest_y);
    return cpu_shadow_radial_distance(dx, dy) - radius;
}

fn cpu_shadow_work_limit() i64 { return 25000000; }

fn cpu_fill_rounded_shadow(surface: *CpuSurface, raw_bounds: Rect,
    raw_radius: i64, raw_blur: i64, clip: Rect,
    transform: Transform, paint: Paint) CpuRasterResult {
    let shape: Rect = cpu_transform_rect(raw_bounds, transform);
    let scale: i64 = transform.scale_x;
    if (transform.scale_y < scale) { scale = transform.scale_y; }
    let radius: i64 = (raw_radius * scale) / unit_scale();
    let blur: i64 = (raw_blur * scale) / unit_scale();
    if (shape.width <= 0 || shape.height <= 0 ||
        radius <= 0 || radius * 2 > shape.width ||
        radius * 2 > shape.height || blur <= 0 ||
        blur > 256 * unit_scale()) {
        return cpu_result(surface.*, CpuRasterError.invalid_geometry,
            0 - 1, 0, 0);
    }
    let expanded: Rect = rect(shape.x - blur, shape.y - blur,
        shape.width + blur * 2, shape.height + blur * 2);
    if (cpu_fixed_safe(expanded.x) == 0 ||
        cpu_fixed_safe(expanded.y) == 0 ||
        cpu_fixed_safe(expanded.width) == 0 ||
        cpu_fixed_safe(expanded.height) == 0) {
        return cpu_result(surface.*, CpuRasterError.invalid_geometry,
            0 - 1, 0, 0);
    }
    let bounds: Rect = cpu_rect_intersection(
        cpu_rect_intersection(expanded, clip),
        rect(0, 0, (surface.*.width as i64) * unit_scale(),
            (surface.*.height as i64) * unit_scale())
    );
    if (bounds.width <= 0 || bounds.height <= 0) {
        return cpu_result(surface.*, CpuRasterError.none, 0 - 1, 0, 0);
    }
    let first_x: i32 = (bounds.x / unit_scale()) as i32;
    let first_y: i32 = (bounds.y / unit_scale()) as i32;
    let last_x: i32 = ((bounds.x + bounds.width + unit_scale() - 1) /
        unit_scale()) as i32;
    let last_y: i32 = ((bounds.y + bounds.height + unit_scale() - 1) /
        unit_scale()) as i32;
    let pixel_count: i64 = ((last_x - first_x) as i64) *
        ((last_y - first_y) as i64);
    if (pixel_count <= 0 || pixel_count > cpu_shadow_work_limit()) {
        return cpu_result(surface.*, CpuRasterError.work_limit,
            0 - 1, 0, 0);
    }
    let denominator: i64 = blur * blur;
    let touched: i64 = 0;
    let y: i32 = first_y;
    while (y < last_y) {
        let x: i32 = first_x;
        while (x < last_x) {
            let center_x: i64 = (x as i64) * unit_scale() +
                unit_scale() / 2;
            let center_y: i64 = (y as i64) * unit_scale() +
                unit_scale() / 2;
            let distance: i64 = cpu_rounded_signed_distance(
                shape, radius, center_x, center_y);
            if (distance < 0) { distance = 0; }
            if (distance < blur) {
                let remaining: i64 = blur - distance;
                let coverage: i64 = (remaining * remaining * 4096) /
                    denominator;
                if (coverage > 0) {
                    cpu_blend_pixel(surface, x, y, paint, coverage);
                    touched = touched + 1;
                }
            }
            x = x + 1;
        }
        y = y + 1;
    }
    return cpu_result(surface.*, CpuRasterError.none, 0 - 1, 0, touched);
}

fn cpu_rect_pixel_coverage(bounds: Rect, x: i32, y: i32) i64 {'''
